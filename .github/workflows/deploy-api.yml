name: Deploy API
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'database/**'
      - 'package-lock.json'
      - 'package.json'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm --workspace @visionhub/api run typecheck
      - run: npm --workspace @visionhub/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
