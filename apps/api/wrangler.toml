name = "visionhub-api"
main = "src/index.ts"
compatibility_date = "2026-09-27"

[vars]
APP_ENV = "production"
ALLOWED_ORIGIN = "*"
OPENAI_MODEL = "gpt-6-astra"
META_GRAPH_VERSION = "v25.0"
META_MEDIA_METRICS = "views,reach,likes,comments,shares,saved"
LARK_CONTENT_ID_FIELD = "Content ID"

[[d1_databases]]
binding = "DB"
database_name = "visionhub-db"
database_id = "b5eb0315-a072-4b62-bc08-275c79968a1c"
migrations_dir = "../../database/migrations"

[triggers]
crons = ["0 * * * *", "0 2 * * *"]
